[package]
edition      = "2024"
name         = "dfr1154"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "dfr1154"
path = "./src/bin/main.rs"

[dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "tcp", "udp", "multicast"] }
embassy-time = "0.5.0"
embedded-io-async = "0.7"
base64 = { version = "0.22", default-features = false }
sha1 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-sha2"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
static_cell = "2.1.1"

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }


esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial", "colors", "critical-section"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
