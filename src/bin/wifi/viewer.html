<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFR1154 Camera</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 2rem auto; padding: 0 1rem; max-width: 640px; background: #17191d; color: #eee; font: 1rem system-ui; }
  img { display: block; width: 100%; height: auto; background: #08090b; }
</style>
<h1>DFR1154 Camera</h1>
<img width="1280" height="720" alt="Live camera feed">
<p role="status"></p>
<script>
const image = document.querySelector('img');
const connectionStatus = document.querySelector('[role=status]');
function connect() {
  connectionStatus.textContent = '';
  image.src = '/stream';
}
image.addEventListener('error', () => {
  connectionStatus.textContent = 'Camera unavailable. Retrying…';
  setTimeout(connect, 1000);
});
connect();
</script>
</html>
