services:
  baby-monitor:
    build: .
    restart: unless-stopped
    # ICE sends UDP directly to the browser. Caddy only proxies HTTP signaling.
    network_mode: host
    env_file: .env
    command:
      - --board
      - ${BOARD_ADDRESS:-dfrobot.local}
      - --host
      - ${GATEWAY_BIND:?Set GATEWAY_BIND to the Caddy bridge gateway IP}
      - --port
      - "18443"
      - --video-fps
      - ${VIDEO_FPS:-8}
      - --public-origin
      - ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the Caddy HTTPS URL}
